<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f5f7fb}
    .card{background:#fff;padding:24px;border-radius:8px;box-shadow:0 6px 18px rgba(18,38,63,.08);width:320px}
    label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
    input[type="text"],input[type="password"]{width:100%;padding:10px;border:1px solid #d8e0eb;border-radius:6px;margin-bottom:12px;font-size:14px}
    button{width:100%;padding:10px;border:0;border-radius:6px;background:#1366d6;color:#fff;font-weight:600;cursor:pointer}
    .help{font-size:13px;color:#6b7280;margin-top:12px;text-align:center}
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="login-heading">
    <h1 id="login-heading" style="font-size:20px;margin:0 0 12px;">Sign in</h1>

    <!-- Form posts to /login with POST method -->
    <form action="/login" method="post" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="text" inputmode="email" autocomplete="email" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required />

      <button type="submit">Sign in</button>
       <button type="reg">Register</button>
    </form>

    <p class="help">Don't have an account? <a href="/signup">Create one</a></p>
  </main>
</body>
</html>
